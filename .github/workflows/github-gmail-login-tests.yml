name: Gmail Login Page Tests

run-name: Gmail login and mocked API tests for ${{ github.ref_name }}

on:
  push:
  pull_request:
  schedule:
    - cron: '0 21 * * 1-5'  
      timezone: 'Europe/London'

permissions:
  contents: read

concurrency:
  group: gmail-login-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  login-tests:
    name: Gmail Login Page and mocked API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npx tsc --noEmit

      - name: Run signed-out Gmail login tests
        run: npx playwright test tests/login-page.spec.ts

      - name: Run mocked Gmail API tests
        run: npx playwright test tests/gmail-bin.mock.spec.ts tests/gmail-spam.mock.spec.ts

      - name: Upload Playwright artifacts on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
